name: multivendor
services:
  postgres:
    image: postgres:16-alpine
    container_name: multivendor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multivendor_app
    ports:
      - "5432:5432"
    volumes:
      - multivendor_postgres_data:/var/lib/postgresql/data

volumes:
  multivendor_postgres_data:
